[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deposco-evals"
version = "0.1.0"
description = "Evals for an orders assistant on data that changes daily"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
dashboard = ["streamlit>=1.67", "pandas>=2.1"]

[tool.setuptools]
packages = ["deposco_evals"]

[tool.setuptools.package-data]
deposco_evals = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
